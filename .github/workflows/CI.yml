name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci:
    name: ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [TESTING, DEBUG, RELEASE]
    uses: ./.github/workflows/_build-and-test.yml
    with:
      build_type: ${{ matrix.build_type }}
    secrets: inherit
